<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>RobiNet</title>
    <!-- Linked for now; to be vendored into www/ so that this works offline. -->
    <!-- Everything this page needs is served from the binary itself: a
         simulator on a machine with no network still gets its interface.
         Pico CSS, uPlot and Alpine (all MIT) live in www/ like the rest; the
         `vendor' target of the Makefile is where their versions are pinned and
         where they are fetched from. -->
    <link rel="stylesheet" href="pico.min.css"/>
    <link rel="stylesheet" href="uplot.min.css"/>
    <link rel="stylesheet" href="style.css"/>
    <!-- Ours first: Alpine dispatches alpine:init as it starts, and a component
         registered after that is never seen. -->
    <script defer src="uplot.min.js"></script>
    <!-- Deferred scripts run in the order they are written: this one defines
         the component that the next one then goes looking for. -->
    <script defer src="app.js"></script>
    <script defer src="alpine.min.js"></script>
</head>
<body x-data="admin" x-init="start()">

<!-- Not a corner of the status bar: if these numbers are no longer live, that
     is the most important thing on the page. -->
<div class="banner" x-show="offline" x-cloak>
    <strong>No answer from the simulator.</strong>
    <span x-show="lastOk">
        Showing what was last known, <span x-text="lastOkText"></span>.
    </span>
    <span x-show="!lastOk">Never managed to reach it.</span>
    <span x-show="live">Trying again in <span x-text="retryIn"></span>s.</span>
    <span x-show="!live">Refresh is off.</span>
    <button class="outline" @click="retryNow()">Try now</button>
</div>

<div class="layout" :class="{ stale: stale }">

    <!-- ============ left column: the clock, and every widget ============ -->
    <aside>
        <hgroup class="brand">
            <h1>RobiNet</h1>
            <p x-text="sims.length + ' simulation' + (sims.length === 1 ? '' : 's')"></p>
        </hgroup>

        <template x-for="s in sims" :key="s.id">
            <article class="sim" :class="{ 'is-serving': s.id === servingId }">
                <header>
                    <strong x-text="s.name"></strong>
                    <!-- Which clock it runs on, which never changes. How fast
                         it is running on it is the line under the buttons. -->
                    <span class="badge"
                          x-text="s.realtime ? 'wall clock' : 'simulated clock'"></span>
                </header>

                <dl class="clock">
                    <dt>now</dt>       <dd x-text="s.now_str"></dd>
                    <dt>events</dt>    <dd x-text="s.pending_events"></dd>
                    <dt>paused for</dt><dd x-text="s.paused_total.toFixed(2) + 's'"></dd>
                </dl>

                <!-- The simulation serving this page must not pause itself, and
                     the API would refuse anyway: do not offer it. -->
                <div class="controls" x-show="s.id !== servingId">
                    <button class="outline" x-show="!s.paused" :disabled="!online"
                            @click="control(s, 'pause')">Pause</button>
                    <!-- Resuming goes back to the speed that was in use:
                         pausing does not disturb it. -->
                    <button x-show="s.paused" :disabled="!online"
                            @click="control(s, 'resume')">Resume</button>

                    <!-- A simulation that follows the wall clock has no speed
                         of ours to set. -->
                    <button class="outline secondary" title="Slower"
                            :disabled="!online || s.realtime"
                            @click="setSpeed(s, slower(s))">&laquo;</button>
                    <button class="outline secondary" title="Real time"
                            :disabled="!online || s.realtime"
                            @click="setSpeed(s, 1)">1&times;</button>
                    <button class="outline secondary" title="Faster"
                            :disabled="!online || s.realtime"
                            @click="setSpeed(s, faster(s))">&raquo;</button>

                    <!-- Only while it is standing still is stepping meaningful. -->
                    <template x-if="s.paused">
                        <span class="steps">
                            <button class="outline secondary" :disabled="!online"
                                    @click="control(s, 'step?n=1')">Step</button>
                            <button class="outline secondary" :disabled="!online"
                                    @click="control(s, 'step?n=10')">Step 10</button>
                        </span>
                    </template>
                </div>
                <p class="speed" x-show="s.id !== servingId">
                    <span x-text="speedText(s)"></span>
                    <!-- Asked to run faster than it can. -->
                    <span class="late" x-show="isLate(s)" :title="lateText(s)"
                          x-cloak>&#9888;</span>
                </p>
                <!-- Whatever this simulation refused, said where it happened. -->
                <p class="sim-error" x-show="simError[s.id]" x-cloak>
                    <small x-text="simError[s.id]"></small>
                </p>

                <nav class="tree">
                    <template x-for="row in tree(s.id)" :key="row.w.id">
                        <div class="row" :style="'padding-left:' + (row.depth * 0.9) + 'rem'"
                             :class="{ selected: isSelected(s.id, row.w.id) }">
                            <button class="twisty" x-show="row.hasKids"
                                    @click="toggle(s.id, row.w.id)"
                                    x-text="row.open ? '▾' : '▸'"></button>
                            <span class="twisty" x-show="!row.hasKids"></span>
                            <a href="#" @click.prevent="select(s.id, row.w.id)"
                               x-text="row.w.name || '(unnamed)'"></a>
                            <span class="count" x-show="row.w.properties.length"
                                  x-text="row.w.properties.length"></span>
                        </div>
                    </template>
                </nav>
            </article>
        </template>
    </aside>

    <!-- ================= main: the selected widget ================= -->
    <main>
        <template x-if="!selected">
            <article class="empty">
                <p>Pick a widget on the left.</p>
            </article>
        </template>

        <template x-if="selected">
            <div class="widget-view" @scroll="repositionMenu()"
                 @resize.window="repositionMenu()">
                <!-- ancestors, as a straight line, always -->
                <nav class="breadcrumb" aria-label="ancestors">
                    <template x-for="(a, i) in ancestors()" :key="a.id">
                        <span>
                            <a href="#" @click.prevent="select(selected.sim, a.id)"
                               x-text="a.name"></a>
                            <span class="sep">/</span>
                        </span>
                    </template>
                    <strong x-text="selected.name"></strong>
                    <!-- The one thing about the selected widget that is not
                         shown below but somewhere else: the log window keeps
                         what it is given, whatever is being looked at. -->
                    <button class="outline secondary watch-logs" :disabled="!online"
                            :class="{ watching: isLogged({ sim: selected.sim, id: selected.id }) }"
                            :title="isLogged({ sim: selected.sim, id: selected.id })
                                    ? 'Stop following what this widget logs'
                                    : 'Follow what this widget logs'"
                            @click="toggleLogged()">logs</button>
                    <small class="error" x-show="logError" x-text="logError"></small>
                </nav>

                <!-- peers to the left, the widget, peers to the right -->
                <div class="inspector">
                    <div class="peers left">
                        <template x-for="p in peersLeft()" :key="p.widget + '-' + p.via">
                            <div class="peer">
                                <a href="#" class="node peer-node"
                                   @click.prevent="select(selected.sim, p.widget)"
                                   x-text="nameOf(p.widget)"></a>
                                <div class="cable">
                                    <a href="#" x-show="p.via !== null"
                                       @click.prevent="select(selected.sim, p.via)"
                                       x-text="nameOf(p.via)"></a>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div class="self">
                        <div class="node current">
                            <strong x-text="selected.name"></strong>
                            <small x-text="selected.full_name"></small>
                        </div>
                    </div>

                    <div class="peers right">
                        <template x-for="p in peersRight()" :key="p.widget + '-' + p.via">
                            <div class="peer">
                                <div class="cable">
                                    <a href="#" x-show="p.via !== null"
                                       @click.prevent="select(selected.sim, p.via)"
                                       x-text="nameOf(p.via)"></a>
                                </div>
                                <a href="#" class="node peer-node"
                                   @click.prevent="select(selected.sim, p.widget)"
                                   x-text="nameOf(p.widget)"></a>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- children, below, always -->
                <div class="children" x-show="children().length">
                    <template x-for="c in children()" :key="c.id">
                        <a href="#" class="node child"
                           @click.prevent="select(selected.sim, c.id)"
                           x-text="c.name"></a>
                    </template>
                </div>

                <!-- ================= properties ================= -->
                <article class="properties">
                    <header>
                        <strong>Properties</strong>
                        <!-- The live refresh deliberately leaves the fields
                             below alone; this is how one asks for their true
                             values back. -->
                        <button class="outline secondary"
                                :disabled="!online || !props.length"
                                title="Read every value again, the editable ones included"
                                @click="loadProps({ full: true })">Refresh</button>
                    </header>

                    <p x-show="propsState === 'loading'" x-cloak>
                        <small>Reading them&hellip;</small></p>
                    <p x-show="propsState === 'loaded' && !props.length" x-cloak>
                        <small>This widget has none.</small></p>
                    <p class="sim-error" x-show="propsState === 'failed'" x-cloak>
                        <small x-text="props.length
                                       ? 'Could not read them again: ' + propsError
                                       : 'Could not read them: ' + propsError"></small>
                    </p>

                    <table x-show="props.length">
                        <thead>
                            <tr><th>Name</th><th>Value</th><th>Description</th></tr>
                        </thead>
                        <tbody>
                            <template x-for="p in props" :key="p.name">
                                <tr :class="{ 'has-error': p.error }">
                                    <td x-text="p.name"></td>
                                    <td>
                                        <!-- A metric: one row per parameter
                                             combination, and when it was last
                                             touched. -->
                                        <template x-if="base(p).type === 'metric'">
                                            <div class="metric">
                                                <p x-show="!p.metric.rows.length" class="ro">
                                                    <small>nothing yet</small></p>
                                                <template x-for="row in p.metric.rows" :key="row.key">
                                                    <div class="metric-row">
                                                        <span class="params"
                                                              x-show="Object.keys(row.params).length"
                                                              x-text="paramsText(row.params)"></span>
                                                        <span class="figure"
                                                              :class="{ changed: fresh(row.changedAt) }"
                                                              x-text="row.figure"></span>
                                                        <small class="detail" x-text="row.detail"></small>
                                                    </div>
                                                </template>
                                                <!-- The button is pinned to the
                                                     right of the cell rather
                                                     than following the text
                                                     beside it, which changes
                                                     width on every refresh. -->
                                                <div class="metric-foot">
                                                    <small class="detail" x-show="p.metric.last !== null"
                                                           x-text="'last ' + ago(p.metric.last)"></small>
                                                    <!-- Dragging this onto a
                                                         chart adds the metric
                                                         there; clicking it
                                                         asks which chart, or
                                                         opens the first one
                                                         outright when there is
                                                         none to choose. -->
                                                    <span class="plot-menu">
                                                        <button class="outline secondary metric-plot"
                                                                :disabled="!online" draggable="true"
                                                                @dragstart="startDrag(p, $event)"
                                                                @dragend="dragging = null ; dragOver = null"
                                                                @click="openChartMenu(p, $el)"
                                                                :title="chartsHere().length
                                                                        ? 'Plot this metric: pick a chart, or drag it onto one'
                                                                        : 'Plot this metric'">
                                                            <svg viewBox="0 0 16 12" aria-hidden="true">
                                                                <polyline points="1,10 5,6 8,8 15,1"/>
                                                            </svg>
                                                        </button>
                                                        <!-- Only ever there for
                                                             one row at a time,
                                                             so it closes on
                                                             anything but the
                                                             button that has
                                                             just opened
                                                             another. -->
                                                        <ul class="menu" x-show="chartMenu === p.name" x-cloak
                                                            @click.outside="if (chartMenu === p.name) chartMenu = null"
                                                            @keydown.escape.window="chartMenu = null">
                                                            <li><a href="#" @click.prevent="newChart(p)">New chart</a></li>
                                                            <template x-for="c in chartsHere()" :key="c.id">
                                                                <li>
                                                                    <a href="#" :class="{ taken: holds(c, p) }"
                                                                       @mouseenter="chartHint = c.id"
                                                                       @mouseleave="chartHint = null"
                                                                       @click.prevent="addTo(c, p)"
                                                                       x-text="chartName(c) +
                                                                               (holds(c, p) ? ' — already there' : '')"></a>
                                                                </li>
                                                            </template>
                                                        </ul>
                                                    </span>
                                                    <button class="outline secondary metric-reset"
                                                            x-show="!p.read_only" :disabled="!online"
                                                            @click="resetMetric(p)">Reset</button>
                                                </div>
                                            </div>
                                        </template>

                                        <!-- A value that may be absent: the box
                                             says whether there is one, and the
                                             input keeps the last one, disabled,
                                             so that ticking it back offers it
                                             again. -->
                                        <template x-if="!p.read_only && p.kind.type === 'optional'">
                                            <input type="checkbox" class="enabler" :disabled="!online"
                                                   x-model="p.enabled"
                                                   :title="p.enabled ? 'unset this value' : 'give it a value'"
                                                   @change="toggleOptional(p, $event.target)"/>
                                        </template>

                                        <span x-show="p.read_only && base(p).type !== 'metric'"
                                              class="ro" :class="{ changed: fresh(p.changedAt),
                                                                   unset: p.value === null }"
                                              x-text="p.value === null ? 'unset' : p.text"></span>

                                        <template x-if="!p.read_only && base(p).type === 'bool'">
                                            <input type="checkbox" :disabled="!online || !set(p)" :checked="p.draft === 'true'"
                                                   @change="p.draft = $event.target.checked ? 'true' : 'false' ; save(p)"/>
                                        </template>

                                        <template x-if="!p.read_only && base(p).type === 'enum'">
                                            <select :disabled="!online || !set(p)" x-model="p.draft" @change="save(p)">
                                                <template x-for="c in base(p).choices" :key="c">
                                                    <option :value="c" x-text="c"></option>
                                                </template>
                                            </select>
                                        </template>

                                        <template x-if="!p.read_only && base(p).type === 'range'">
                                            <span class="range">
                                                <template x-if="hasSlider(base(p))">
                                                    <input type="range" :disabled="!online || !set(p)"
                                                           :min="base(p).min" :max="base(p).max"
                                                           :step="sliderStep(base(p))"
                                                           x-model="p.draft" @change="save(p)"/>
                                                </template>
                                                <input type="number" :disabled="!online || !set(p)"
                                                       :min="base(p).min" :max="base(p).max"
                                                       :step="base(p).int ? 1 : 'any'" x-model="p.draft"
                                                       @keydown.enter="save(p)" @blur="save(p)"/>
                                            </span>
                                        </template>

                                        <template x-if="!p.read_only && (base(p).type === 'int' || base(p).type === 'float')">
                                            <input type="number" :disabled="!online || !set(p)"
                                                   :step="base(p).type === 'int' ? 1 : 'any'"
                                                   x-model="p.draft"
                                                   @keydown.enter="save(p)" @blur="save(p)"/>
                                        </template>

                                        <template x-if="!p.read_only && base(p).type === 'string'">
                                            <input type="text" :disabled="!online || !set(p)" x-model="p.draft"
                                                   @keydown.enter="save(p)" @blur="save(p)"/>
                                        </template>

                                        <!-- What the value is counted in, kept
                                             beside the value rather than in it:
                                             what is typed and what is sent must
                                             stay the bare number. A metric's
                                             figures carry their own. -->
                                        <small class="units" x-show="p.units && base(p).type !== 'metric'"
                                               x-text="p.units"></small>
                                    </td>
                                    <td>
                                        <small x-text="p.descr"></small>
                                        <small class="error" x-show="p.error" x-text="p.error"></small>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </article>
            </div>
        </template>

        <!-- ================= the dock ================= -->
        <!-- Outside the block above: what is watched here outlives the
             selection, a chart as much as a log. Each panel keeps a header
             that stays put when it is folded away, so that what is being
             watched is legible even when it is not shown. -->
        <section class="dock" x-show="charts.length || logged.length" x-cloak>

        <section class="panel" x-show="charts.length">
            <header>
                <button class="twisty" @click="fold('charts')"
                        :title="collapsed.charts ? 'Show them' : 'Fold them away'"
                        x-text="collapsed.charts ? '▸' : '▾'"></button>
                <strong>Charts</strong>
                <small x-text="charts.length + (charts.length > 1 ? ' charts' : ' chart')"></small>
            </header>
        <div class="body charts" x-show="!collapsed.charts">
            <template x-for="c in charts" :key="c.id">
                <article class="chart"
                         :class="{ over: dragOver === c.id || chartHint === c.id }"
                         @dragover.prevent="dragOver = canDrop(c) ? c.id : null"
                         @dragleave="dragOver = null"
                         @drop.prevent="dropOn(c)">
                    <header>
                        <!-- A chart is named only while a menu is open on some
                             metric: the name is there to be matched against
                             that menu, and says nothing the rest of the
                             time. -->
                        <strong class="chart-name" x-show="chartMenu" x-cloak
                                x-text="chartName(c)"></strong>
                        <span class="chart-legend">
                            <template x-for="l in lines(c)" :key="l.key">
                                <span class="entry">
                                    <i :style="'background:' + l.color"></i>
                                    <span class="what" x-text="l.label"></span>
                                    <b x-text="l.text"></b>
                                    <small x-text="l.units"></small>
                                    <button title="Take this line off the chart"
                                            @click="removeLine(c, l.key)">&times;</button>
                                </span>
                            </template>
                            <span class="entry empty" x-show="!lines(c).length">
                                <small>Nothing has been written down yet.</small>
                            </span>
                        </span>
                        <button class="close" title="Close this chart"
                                @click="closeChart(c)">&times;</button>
                    </header>
                    <div class="plot" x-init="mountChart(c, $el)"></div>
                </article>
            </template>
        </div>
        </section>

        <section class="panel logs" x-show="logged.length">
            <header>
                <button class="twisty" @click="fold('logs')"
                        :title="collapsed.logs ? 'Show them' : 'Fold them away'"
                        x-text="collapsed.logs ? '▸' : '▾'"></button>
                <strong>Logs</strong>
                <!-- One entry per widget: what it is, how deep to follow it,
                     and a cross to stop. -->
                <span class="log-legend">
                    <template x-for="w in logged" :key="w.sim + '/' + w.widget">
                        <span class="entry">
                            <i :style="'background:' + w.color"></i>
                            <span class="what" x-text="w.name"></span>
                            <select x-model="w.level" :disabled="!online"
                                    title="How deep to follow this one"
                                    @change="relevel(w)">
                                <template x-for="l in levels" :key="l">
                                    <option :value="l" x-text="l"></option>
                                </template>
                            </select>
                            <button title="Stop following this one"
                                    @click="unwatch(w)">&times;</button>
                        </span>
                    </template>
                </span>
                <!-- Only there when the reader has scrolled away from the
                     newest line, which is the only time it has anything to
                     do. -->
                <button class="outline secondary follow-tail" x-show="!logFollow"
                        title="Jump to the newest line and follow it"
                        @click="jumpToBottom()">&darr; newest</button>
            </header>
            <div class="body log" x-show="!collapsed.logs"
                 x-ref="logBody" x-init="mountLog($el)" @scroll="onLogScroll()">
                <template x-for="m in logLines()" :key="m.key">
                    <div class="line" :class="m.level">
                        <span class="t" x-text="clock(m.t)"></span>
                        <span class="who" :style="'color:' + m.color"
                              x-text="m.who"></span>
                        <span class="msg" x-text="m.text"></span>
                    </div>
                </template>
                <p class="quiet" x-show="!logLines().length">
                    <small>Nothing logged yet.</small></p>
            </div>
        </section>

        </section>
    </main>
</div>

<footer class="status" :class="{ bad: offline }">
    <span x-show="conn === 'connecting'" x-cloak>connecting&hellip;</span>
    <span x-show="online" x-cloak>
        connected, refreshing every <span x-text="period"></span>s
    </span>
    <span x-show="offline" x-cloak>
        no answer &mdash; last heard from <span x-text="lastOkText"></span>
    </span>
    <label title="Keep the read-only values up to date; editable fields are left as they are">
        <input type="checkbox" x-model="live"/> live
    </label>
</footer>

</body>
</html>
