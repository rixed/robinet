<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>RobiNet</title>
    <!-- Linked for now; to be vendored into www/ so that this works offline. -->
    <!-- Everything this page needs is served from the binary itself: a
         simulator on a machine with no network still gets its interface.
         Pico CSS, uPlot and Alpine (all MIT) live in www/ like the rest; the
         `vendor' target of the Makefile is where their versions are pinned and
         where they are fetched from. -->
    <link rel="stylesheet" href="pico.min.css"/>
    <link rel="stylesheet" href="uplot.min.css"/>
    <link rel="stylesheet" href="style.css"/>
    <!-- Ours first: Alpine dispatches alpine:init as it starts, and a component
         registered after that is never seen. -->
    <script defer src="uplot.min.js"></script>
    <!-- Data, not code: the coastlines the map draws. Before app.js only for
         tidiness -- nothing reads it until something is drawn. -->
    <script defer src="coast.js"></script>
    <!-- Deferred scripts run in the order they are written: this one defines
         the component that the next one then goes looking for. -->
    <script defer src="app.js"></script>
    <script defer src="alpine.min.js"></script>
</head>
<body x-data="admin" x-init="start()"
      @keydown.escape.window="cancelAdd()">

<!-- Across the top, not tucked away in a corner: if these numbers are no
     longer live, that is the most important thing on the page. -->
<div class="banner" x-show="offline" x-cloak>
    <strong>No answer from the simulator.</strong>
    <span x-show="lastOk">
        Showing what was last known, <span x-text="lastOkText"></span>.
    </span>
    <span x-show="!lastOk">Never managed to reach it.</span>
    <span>Trying again in <span x-text="retryIn"></span>s.</span>
    <button class="outline" @click="retryNow()">Try now</button>
</div>

<div class="layout" :class="{ stale: stale }">

    <!-- ============ left column: the clock, and every widget ============ -->
    <aside>
        <hgroup class="brand">
            <h1>
                <a href="https://happyleptic.org/robinet.html"
                   target="_blank" rel="noopener noreferrer"
                   title="About RobiNet (opens in a new tab)">RobiNet<!--
                --><svg class="ext" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14 4h6v6"/>
                        <path d="M20 4l-8 8"/>
                        <path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
                    </svg></a>
            </h1>
            <p x-text="sims.length + ' simulation' + (sims.length === 1 ? '' : 's')"></p>
        </hgroup>

        <template x-for="s in sims" :key="s.id">
            <article class="sim" :class="{ 'is-serving': s.id === servingId,
                                           folded: simFolded.includes(s.id) }">
                <header>
                    <button class="twisty" @click="foldSim(s.id)"
                            :title="simFolded.includes(s.id)
                                    ? 'Show this simulation' : 'Fold it away'"
                            x-text="simFolded.includes(s.id) ? '\u25b8' : '\u25be'"></button>
                    <strong x-text="s.name"></strong>
                    <!-- Folded away, the header is all there is of it, so what
                         its clock is doing goes there: the reason to fold one
                         is that it is not the one being worked on, not that one
                         has stopped caring whether it is running. -->
                    <span class="badge" x-show="simFolded.includes(s.id)"
                          x-text="speedText(s)"></span>
                    <!-- Which clock it runs on, which never changes. How fast
                         it is running on it is the line under the buttons. -->
                    <span class="badge" x-show="!simFolded.includes(s.id)"
                          x-text="s.realtime ? 'wall clock' : 'simulated clock'"></span>
                </header>

                <div class="body" x-show="!simFolded.includes(s.id)">

                <dl class="clock">
                    <dt>now</dt>       <dd x-text="s.now_str"></dd>
                    <!-- What is waiting to happen, not what has happened:
                         the size of the clock's queue. -->
                    <dt>pending</dt>
                    <dd><span x-text="s.pending_events"></span>
                        <small>event<span x-show="s.pending_events !== 1">s</span></small></dd>
                    <dt>paused for</dt><dd x-text="s.paused_total.toFixed(2) + 's'"></dd>
                </dl>

                <!-- The simulation serving this page must not pause itself, and
                     the API would refuse anyway: do not offer it. -->
                <div class="controls" x-show="s.id !== servingId">
                    <!-- Drawn rather than written, and drawn rather than
                         typed: the two bars and the triangle are read without
                         reading, and they take a fraction of the room. As an
                         SVG and not a character, because the ones that mean
                         these two are not in every font, and a missing glyph
                         is a button with nothing on it. -->
                    <button class="outline icon" x-show="!s.paused"
                            :disabled="!online" aria-label="Pause" title="Pause"
                            @click="control(s, 'pause')">
                        <svg viewBox="0 0 10 12" aria-hidden="true">
                            <rect x="1" y="1" width="3" height="10"/>
                            <rect x="6" y="1" width="3" height="10"/>
                        </svg>
                    </button>
                    <!-- Resuming goes back to the speed that was in use:
                         pausing does not disturb it. -->
                    <button class="icon" x-show="s.paused" :disabled="!online"
                            aria-label="Resume" title="Resume"
                            @click="control(s, 'resume')">
                        <svg viewBox="0 0 10 12" aria-hidden="true">
                            <path d="M1 1 L9 6 L1 11 Z"/>
                        </svg>
                    </button>

                    <!-- Only while it is running: a speed set on a standing
                         clock does nothing one can see, and these buttons would
                         be three ways of appearing to start it without starting
                         it. What they set is remembered across a pause anyway,
                         so there is nothing lost by asking after resuming.
                         A simulation that follows the wall clock has no speed
                         of ours to set. -->
                    <template x-if="!s.paused">
                        <span class="speeds">
                            <!-- Minus and plus rather than arrows: an arrow on
                                 a clock reads as moving through time, and a
                                 leftward one as going back in it, which is not
                                 something a simulation can do. The rung each
                                 one leads to is in its tooltip rather than on
                                 its face: written there, the button would
                                 change width as it was used, and the ones
                                 beside it would shift out from under the
                                 pointer. -->
                            <button class="outline secondary" aria-label="Slower"
                                    :title="'Slower: ' + speedTip(slower(s))"
                                    :disabled="!online || s.realtime"
                                    @click="setSpeed(s, slower(s))">&minus;</button>
                            <button class="outline secondary" aria-label="Real time"
                                    title="Real time: 1 &times; real time"
                                    :disabled="!online || s.realtime"
                                    @click="setSpeed(s, 1)">1&times;</button>
                            <button class="outline secondary" aria-label="Faster"
                                    :title="'Faster: ' + speedTip(faster(s))"
                                    :disabled="!online || s.realtime"
                                    @click="setSpeed(s, faster(s))">+</button>
                            <!-- Off the top of the ladder, in one go. -->
                            <button class="outline secondary" aria-label="Full speed"
                                    title="Full speed: as fast as it can go"
                                    :disabled="!online || s.realtime"
                                    @click="setSpeed(s, null)">&raquo;</button>
                        </span>
                    </template>

                    <!-- Only while it is standing still is stepping meaningful. -->
                    <template x-if="s.paused">
                        <span class="steps">
                            <button class="outline secondary" :disabled="!online"
                                    @click="control(s, 'step?n=1')">Step</button>
                            <button class="outline secondary" :disabled="!online"
                                    @click="control(s, 'step?n=10')">Step 10</button>
                        </span>
                    </template>
                </div>
                <p class="speed" x-show="s.id !== servingId">
                    <span x-text="speedText(s)"></span>
                    <!-- Asked to run faster than it can. -->
                    <span class="late" x-show="isLate(s)" :title="lateText(s)"
                          x-cloak>&#9888;</span>
                </p>
                <!-- Whatever this simulation refused, said where it happened. -->
                <p class="sim-error" x-show="simError[s.id]" x-cloak>
                    <small x-text="simError[s.id]"></small>
                </p>

                <nav class="tree">
                    <template x-for="row in tree(s.id)" :key="row.w.id">
                        <div class="row" :style="'padding-left:' + (row.depth * 0.9) + 'rem'"
                             :class="{ selected: isSelected(s.id, row.w.id) }">
                            <button class="twisty" x-show="row.hasKids"
                                    @click="toggle(s.id, row.w.id)"
                                    x-text="row.open ? '▾' : '▸'"></button>
                            <span class="twisty" x-show="!row.hasKids"></span>
                            <a href="#" @click.prevent="select(s.id, row.w.id)"
                               x-text="row.w.name || '(unnamed)'"></a>
                            <span class="count" x-show="row.w.properties.length"
                                  x-text="row.w.properties.length"></span>
                        </div>
                    </template>
                </nav>
                </div>
            </article>
        </template>
    </aside>

    <!-- ================= main: the selected widget ================= -->
    <main>
        <template x-if="!selected">
            <article class="empty">
                <p>Pick a widget on the left.</p>
            </article>
        </template>

        <template x-if="selected">
            <div class="widget-view" @scroll="repositionMenu()"
                 @resize.window="repositionMenu()">
                <!-- The map beside everything about the selected widget --
                     what it is made of, and what it is worth -- rather than
                     instead of it: one is forever wanting the other. The
                     divider between the two columns is also the switch between
                     them: dragged to either side, it shuts that side.
                     This column is what scrolls; the map keeps its room. -->
                <div class="panes">
                    <div class="pane detail" x-show="split > 0" x-cloak
                         :style="`flex-basis: ${split * 100}%`"
                         @scroll="repositionMenu()">
                        <div class="schematic" x-show="!adding">
                            <!-- ancestors, as a straight line, always -->
                            <nav class="breadcrumb" aria-label="ancestors">
                                <template x-for="(a, i) in ancestors()" :key="a.id">
                                    <span>
                                        <a href="#" @click.prevent="select(selected.sim, a.id)"
                                           x-text="a.name"></a>
                                        <span class="sep">/</span>
                                    </span>
                                </template>
                                <strong x-text="selected.name"></strong>
                                <!-- The one thing about the selected widget that is not
                                     shown below but somewhere else: the log window keeps
                                     what it is given, whatever is being looked at. -->
                                <button class="outline secondary watch-logs" :disabled="!online"
                                        :class="{ watching: isLogged({ sim: selected.sim, id: selected.id }) }"
                                        :title="isLogged({ sim: selected.sim, id: selected.id })
                                                ? 'Stop following what this widget logs'
                                                : 'Follow what this widget logs'"
                                        @click="toggleLogged()">logs</button>
                                <!-- Only where it would work: a part of a device
                                     is not a device, and what this interface
                                     cannot build back it does not offer to take
                                     away. Asked twice, since it cannot be
                                     undone. -->
                                <button class="outline delete" x-show="selected.deletable"
                                        x-cloak :disabled="!online"
                                        :class="{ arming: confirmDelete }"
                                        :title="confirmDelete
                                                ? 'This cannot be undone'
                                                : 'Take this device out of the simulation, with the cables that reach it'"
                                        @click="deleteSelected()"
                                        x-text="confirmDelete ? 'really?' : 'delete'"></button>
                                <small class="error" x-show="logError" x-text="logError"></small>
                            </nav>

                            <!-- peers to the left, the widget, peers to the right -->
                            <div class="inspector">
                                <div class="peers left">
                                    <template x-for="p in peersLeft()" :key="p.widget + '-' + p.via">
                                        <div class="peer">
                                            <a href="#" class="node peer-node"
                                               @click.prevent="select(selected.sim, p.widget)"
                                               x-text="nameOf(p.widget)"></a>
                                            <div class="cable">
                                                <a href="#" x-show="p.via !== null"
                                                   @click.prevent="select(selected.sim, p.via)"
                                                   x-text="nameOf(p.via)"></a>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="self">
                                    <div class="node current">
                                        <strong x-text="selected.name"></strong>
                                        <small x-text="selected.full_name"></small>
                                    </div>
                                </div>

                                <div class="peers right">
                                    <template x-for="p in peersRight()" :key="p.widget + '-' + p.via">
                                        <div class="peer">
                                            <div class="cable">
                                                <a href="#" x-show="p.via !== null"
                                                   @click.prevent="select(selected.sim, p.via)"
                                                   x-text="nameOf(p.via)"></a>
                                            </div>
                                            <a href="#" class="node peer-node"
                                               @click.prevent="select(selected.sim, p.widget)"
                                               x-text="nameOf(p.widget)"></a>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- children, below, always -->
                            <div class="children" x-show="children().length">
                                <template x-for="c in children()" :key="c.id">
                                    <a href="#" class="node child"
                                       @click.prevent="select(selected.sim, c.id)"
                                       x-text="c.name"></a>
                                </template>
                            </div>

                        </div>

                        <!-- ================= what is being built =================

                             In the schematic's place rather than over it: what
                             is being built has no schematic yet, and a form
                             laid over the map could not be filled in from the
                             map, which is where a cable's two ends are
                             clicked. -->
                        <form class="creator" x-show="adding" x-cloak
                              @submit.prevent="submitAdd()">
                            <template x-if="adding">
                                <div>
                                    <header>
                                        <strong x-text="'New ' + adding.type"></strong>
                                        <small x-text="adding.descr"></small>
                                    </header>

                                    <label class="field">
                                        <span class="what">name</span>
                                        <!-- Empty, and the server names it: the
                                             box shows what it would be called,
                                             the way a parameter's box shows
                                             what leaving it out will do. -->
                                        <input type="text" x-model="adding.name"
                                               :disabled="!online" x-ref="newName"
                                               :placeholder="adding.nameHint"/>
                                    </label>

                                    <template x-for="f in adding.fields" :key="f.name">
                                        <label class="field">
                                            <span class="what" x-text="f.name"></span>

                                            <!-- An end that was clicked on the map.
                                                 Shown rather than edited: it is
                                                 what the reader pointed at. -->
                                            <template x-if="f.picked !== null">
                                                <strong class="picked" x-text="nameOf(f.picked)"></strong>
                                            </template>

                                            <template x-if="f.picked === null">
                                                <span class="input">
                                                    <!-- Something that may be left
                                                         out: the box says whether it
                                                         is, the input keeps what was
                                                         typed either way. -->
                                                    <template x-if="f.kind.type === 'optional'">
                                                        <input type="checkbox" class="enabler"
                                                               x-model="f.enabled" :disabled="!online"
                                                               :title="f.enabled ? 'leave this out'
                                                                                 : 'give it a value'"/>
                                                    </template>

                                                    <template x-if="base(f).type === 'bool'">
                                                        <input type="checkbox" :disabled="!online"
                                                               :class="{ unset: !set(f) }"
                                                               :checked="f.draft === 'true'"
                                                               @change="f.draft = $event.target.checked ? 'true' : 'false' ;
                                                                        enable(f)"/>
                                                    </template>

                                                    <template x-if="base(f).type === 'enum'">
                                                        <select :disabled="!online" :class="{ unset: !set(f) }"
                                                                x-model="f.draft" @change="enable(f)">
                                                            <!-- Worth its place among the choices, not
                                                                 its own text: that is what the
                                                                 simulator keeps. -->
                                                            <template x-for="(c, i) in base(f).choices" :key="i">
                                                                <option :value="i" x-text="c"></option>
                                                            </template>
                                                        </select>
                                                    </template>

                                                    <template x-if="base(f).type === 'range'">
                                                        <input type="number" :disabled="!online"
                                                               :class="{ unset: !set(f) }"
                                                               :min="base(f).min" :max="base(f).max"
                                                               :step="base(f).int ? 1 : 'any'"
                                                               :placeholder="f.placeholder || hint(f)"
                                                               x-model="f.draft" @input="enable(f)"/>
                                                    </template>

                                                    <template x-if="base(f).type === 'int' || base(f).type === 'float'">
                                                        <input type="number" :disabled="!online"
                                                               :class="{ unset: !set(f) }"
                                                               :step="base(f).type === 'int' ? 1 : 'any'"
                                                               :placeholder="f.placeholder || hint(f)"
                                                               x-model="f.draft" @input="enable(f)"/>
                                                    </template>

                                                    <template x-if="base(f).type === 'string'">
                                                        <input type="text" :disabled="!online"
                                                               :class="{ unset: !set(f) }"
                                                               :placeholder="f.placeholder || hint(f)"
                                                               x-model="f.draft" @input="enable(f)"/>
                                                    </template>

                                                    <small class="units" x-show="f.units" x-text="f.units"></small>
                                                </span>
                                            </template>

                                            <small class="descr" x-text="f.descr"></small>
                                        </label>
                                    </template>

                                    <footer>
                                        <small class="error" x-show="adding.error"
                                               x-text="adding.error"></small>
                                        <button type="button" class="outline secondary"
                                                @click="cancelAdd()">Cancel</button>
                                        <button type="submit" :disabled="!online || adding.busy"
                                                x-text="adding.busy ? 'Building...' : 'Build'"></button>
                                    </footer>
                                </div>
                            </template>
                        </form>

                        <!-- ================= properties ================= -->
                        <article class="properties" x-show="!adding">
                            <header>
                                <strong>Properties</strong>
                                <!-- The live refresh deliberately leaves the fields
                                     below alone; this is how one asks for their true
                                     values back. -->
                                <button class="outline secondary"
                                        :disabled="!online || !shownProps().length"
                                        title="Read every value again, the editable ones included"
                                        @click="loadProps({ full: true })">Refresh</button>
                            </header>

                            <p x-show="propsState === 'loading'" x-cloak>
                                <small>Reading them&hellip;</small></p>
                            <p x-show="propsState === 'loaded' && !shownProps().length" x-cloak>
                                <small>This widget has none to show.</small></p>
                            <p class="sim-error" x-show="propsState === 'failed'" x-cloak>
                                <small x-text="props.length
                                               ? 'Could not read them again: ' + propsError
                                               : 'Could not read them: ' + propsError"></small>
                            </p>

                            <table x-show="shownProps().length">
                                <thead>
                                    <tr><th>Name</th><th>Value</th></tr>
                                </thead>
                                <tbody>
                                    <template x-for="p in shownProps()" :key="p.name">
                                        <tr :class="{ 'has-error': p.error }">
                                            <td>
                                                <span x-text="p.name"></span>
                                                <!-- Under the name in small print
                                                     rather than in a column of its
                                                     own: it is read once, when one
                                                     wonders what the property is, and
                                                     the width it was taking is the
                                                     width the values needed. Not a
                                                     tooltip either -- unreachable on a
                                                     touch screen, and invisible to
                                                     someone scanning the table for the
                                                     thing they cannot name. -->
                                                <small class="descr" x-show="p.descr"
                                                       x-text="p.descr"></small>
                                            </td>
                                            <!-- The file's download sits at the right
                                                 edge of the cell, where a metric has
                                                 its buttons: laid out as a row so that
                                                 the name keeps the left. -->
                                            <td :class="{ file: base(p).type === 'filename' && p.value }">
                                                <!-- A metric: one row per parameter
                                                     combination, and when it was last
                                                     touched. -->
                                                <template x-if="base(p).type === 'metric'">
                                                    <div class="metric">
                                                        <p x-show="!p.metric.rows.length" class="ro">
                                                            <small>nothing yet</small></p>
                                                        <template x-for="row in p.metric.rows" :key="row.key">
                                                            <div class="metric-row">
                                                                <span class="params"
                                                                      x-show="Object.keys(row.params).length"
                                                                      x-text="paramsText(row.params)"></span>
                                                                <span class="figure"
                                                                      :class="{ changed: fresh(row.changedAt) }"
                                                                      x-text="row.figure"></span>
                                                                <small class="detail" x-text="row.detail"></small>
                                                            </div>
                                                        </template>
                                                        <!-- The button is pinned to the
                                                             right of the cell rather
                                                             than following the text
                                                             beside it, which changes
                                                             width on every refresh. -->
                                                        <div class="metric-foot">
                                                            <small class="detail" x-show="p.metric.last !== null"
                                                                   x-text="'last ' + ago(p.metric.last)"></small>
                                                            <!-- Dragging this onto a
                                                                 chart adds the metric
                                                                 there; clicking it
                                                                 asks which chart, or
                                                                 opens the first one
                                                                 outright when there is
                                                                 none to choose. -->
                                                            <span class="plot-menu">
                                                                <button class="outline secondary metric-plot"
                                                                        :disabled="!online" draggable="true"
                                                                        @dragstart="startDrag(p, $event)"
                                                                        @dragend="dragging = null ; dragOver = null"
                                                                        @click="openChartMenu(p, $el)"
                                                                        :title="chartsHere().length
                                                                                ? 'Plot this metric: pick a chart, or drag it onto one'
                                                                                : 'Plot this metric'">
                                                                    <svg viewBox="0 0 16 12" aria-hidden="true">
                                                                        <polyline points="1,10 5,6 8,8 15,1"/>
                                                                    </svg>
                                                                </button>
                                                                <!-- Only ever there for
                                                                     one row at a time,
                                                                     so it closes on
                                                                     anything but the
                                                                     button that has
                                                                     just opened
                                                                     another. -->
                                                                <ul class="menu" x-show="chartMenu === p.name" x-cloak
                                                                    @click.outside="if (chartMenu === p.name) chartMenu = null"
                                                                    @keydown.escape.window="chartMenu = null">
                                                                    <li><a href="#" @click.prevent="newChart(p)">New chart</a></li>
                                                                    <template x-for="c in chartsHere()" :key="c.id">
                                                                        <li>
                                                                            <a href="#" :class="{ taken: holds(c, p) }"
                                                                               @mouseenter="chartHint = c.id"
                                                                               @mouseleave="chartHint = null"
                                                                               @click.prevent="addTo(c, p)"
                                                                               x-text="chartName(c) +
                                                                                       (holds(c, p) ? ' — already there' : '')"></a>
                                                                        </li>
                                                                    </template>
                                                                </ul>
                                                            </span>
                                                            <button class="outline secondary metric-reset"
                                                                    x-show="!p.read_only" :disabled="!online"
                                                                    @click="resetMetric(p)">Reset</button>
                                                        </div>
                                                    </div>
                                                </template>

                                                <!-- A value that may be absent: the box
                                                     says whether there is one, and the
                                                     input keeps the last one, disabled,
                                                     so that ticking it back offers it
                                                     again. -->
                                                <template x-if="!p.read_only && p.kind.type === 'optional'">
                                                    <input type="checkbox" class="enabler" :disabled="!online"
                                                           x-model="p.enabled"
                                                           :title="p.enabled ? 'unset this value' : 'give it a value'"
                                                           @change="toggleOptional(p, $event.target)"/>
                                                </template>

                                                <span x-show="p.read_only && base(p).type !== 'metric'
                                                               && !structured(p)"
                                                      class="ro" :class="{ changed: fresh(p.changedAt),
                                                                           unset: p.value === null }"
                                                      x-text="shown(p)"></span>

                                                <!-- A file the widget has written: its name, and the
                                                     way to fetch it. A link and not a button, since
                                                     the answer says it is an attachment -- the
                                                     browser saves it rather than showing it, under
                                                     the name the simulator knows it by; boxed like
                                                     the buttons of a metric, since that is what it
                                                     is used as. -->
                                                <template x-if="base(p).type === 'filename' && p.value">
                                                    <a role="button" class="outline secondary download"
                                                       :href="fileUrl(p)"
                                                       :title="'Download ' + p.value">
                                                        <svg viewBox="0 0 16 12" aria-hidden="true">
                                                            <polyline points="8,1 8,8"/>
                                                            <polyline points="4,5 8,9 12,5"/>
                                                            <polyline points="2,11 14,11"/>
                                                        </svg>
                                                    </a>
                                                </template>

                                                <template x-if="!p.read_only && base(p).type === 'bool'">
                                                    <input type="checkbox" :disabled="!online" :class="{ unset: !set(p) }"
                                                           :checked="p.draft === 'true'"
                                                           @change="p.draft = $event.target.checked ? 'true' : 'false' ;
                                                                    enable(p) ; save(p)"/>
                                                </template>

                                                <template x-if="!p.read_only && base(p).type === 'enum'">
                                                    <select :disabled="!online" :class="{ unset: !set(p) }"
                                                            x-model="p.draft" @change="enable(p) ; save(p)">
                                                        <template x-for="(c, i) in base(p).choices" :key="i">
                                                            <option :value="i" x-text="c"></option>
                                                        </template>
                                                    </select>
                                                </template>

                                                <template x-if="!p.read_only && base(p).type === 'range'">
                                                    <span class="range">
                                                        <template x-if="hasSlider(base(p))">
                                                            <input type="range" :disabled="!online"
                                                                   :class="{ unset: !set(p) }"
                                                                   :min="base(p).min" :max="base(p).max"
                                                                   :step="sliderStep(base(p))"
                                                                   x-model="p.draft" @input="enable(p)"
                                                                   @change="save(p)"/>
                                                        </template>
                                                        <input type="number" :disabled="!online"
                                                               :class="{ unset: !set(p) }"
                                                               :min="base(p).min" :max="base(p).max"
                                                               :step="base(p).int ? 1 : 'any'" x-model="p.draft"
                                                               @input="enable(p)"
                                                               @keydown.enter="save(p)" @blur="save(p)"/>
                                                    </span>
                                                </template>

                                                <template x-if="!p.read_only && (base(p).type === 'int' || base(p).type === 'float')">
                                                    <input type="number" :disabled="!online"
                                                           :class="{ unset: !set(p) }"
                                                           :step="base(p).type === 'int' ? 1 : 'any'"
                                                           :placeholder="hint(p)"
                                                           x-model="p.draft" @input="enable(p)"
                                                           @keydown.enter="save(p)" @blur="save(p)"/>
                                                </template>

                                                <template x-if="!p.read_only && (base(p).type === 'string' ||
                                                                                 base(p).type === 'filename')">
                                                    <input type="text" :disabled="!online" :class="{ unset: !set(p) }"
                                                           :placeholder="hint(p)"
                                                           x-model="p.draft" @input="enable(p)"
                                                           @keydown.enter="save(p)" @blur="save(p)"/>
                                                </template>

                                                <!-- A list or a record: a table of cells.

                                                     A record is the table of a
                                                     single row -- its fields are
                                                     the columns, in the order the
                                                     simulator named them -- and a
                                                     list of records is that row
                                                     repeated. A list of bare values
                                                     is one column, with nothing to
                                                     head it with.

                                                     Sent when the reader says so
                                                     rather than on the way out of a
                                                     cell: half a row is not a value
                                                     anything could accept. -->
                                                <template x-if="structured(p)">
                                                    <div class="listing" :class="{ dirty: p.dirty }">
                                                        <table>
                                                            <thead x-show="cols(p)">
                                                                <tr>
                                                                    <template x-for="f in cols(p) || []" :key="f.name">
                                                                        <th x-text="f.name"></th>
                                                                    </template>
                                                                    <th class="row-tools" x-show="growable(p)"></th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                <template x-for="row in p.rows" :key="row.key">
                                                                    <tr :class="{ dragged: dragRow === row.key }">
                                                                        <template x-for="(c, i) in row.cells" :key="i">
                                                                            <!-- The cell is a line of its own: the box
                                                                                 that says whether there is a value
                                                                                 keeps its place at the left of it,
                                                                                 and the input takes what room is
                                                                                 left. -->
                                                                            <td><span class="cell">
                                                                                <span x-show="p.read_only" class="ro"
                                                                                      :class="{ unset: !set(c) }"
                                                                                      x-text="cellText(c)"></span>

                                                                                <!-- Same box as anywhere else a value
                                                                                     may be left out, in front of the
                                                                                     input for it. -->
                                                                                <template x-if="!p.read_only && c.kind.type === 'optional'">
                                                                                    <input type="checkbox" class="enabler"
                                                                                           :disabled="!online" x-model="c.enabled"
                                                                                           @change="touch(p)"
                                                                                           :title="c.enabled ? 'leave this out'
                                                                                                             : 'give it a value'"/>
                                                                                </template>

                                                                                <template x-if="!p.read_only && cellInput(c) === 'bool'">
                                                                                    <input type="checkbox" :disabled="!online"
                                                                                           :class="{ unset: !set(c) }"
                                                                                           :checked="c.draft === 'true'"
                                                                                           @change="c.draft = $event.target.checked ? 'true' : 'false' ;
                                                                                                    enable(c) ; touch(p)"/>
                                                                                </template>

                                                                                <template x-if="!p.read_only && cellInput(c) === 'enum'">
                                                                                    <select :disabled="!online" :class="{ unset: !set(c) }"
                                                                                            x-model="c.draft" @change="enable(c) ; touch(p)">
                                                                                        <template x-for="(ch, i) in base(c).choices" :key="i">
                                                                                            <option :value="i" x-text="ch"></option>
                                                                                        </template>
                                                                                    </select>
                                                                                </template>

                                                                                <!-- No slider in a cell: a column of
                                                                                     tracks is unreadable, and there is
                                                                                     no room for one beside the number
                                                                                     anyway. The bounds still hold. -->
                                                                                <template x-if="!p.read_only && cellInput(c) === 'number'">
                                                                                    <input type="number" :disabled="!online"
                                                                                           :class="{ unset: !set(c) }"
                                                                                           :min="base(c).type === 'range' ? base(c).min : null"
                                                                                           :max="base(c).type === 'range' ? base(c).max : null"
                                                                                           :step="base(c).type === 'int' ||
                                                                                                  (base(c).type === 'range' && base(c).int)
                                                                                                  ? 1 : 'any'"
                                                                                           :placeholder="hint(c)"
                                                                                           x-model="c.draft"
                                                                                           @input="enable(c) ; touch(p)"/>
                                                                                </template>

                                                                                <template x-if="!p.read_only && cellInput(c) === 'text'">
                                                                                    <input type="text" :disabled="!online"
                                                                                           :class="{ unset: !set(c) }"
                                                                                           :placeholder="hint(c)"
                                                                                           x-model="c.draft"
                                                                                           @input="enable(c) ; touch(p)"/>
                                                                                </template>
                                                                            </span></td>
                                                                        </template>
                                                                        <td class="row-tools" x-show="growable(p)">
                                                                            <!-- Where a row is in the list is part of
                                                                                 what the list says -- the first route
                                                                                 that matches is the one taken -- so
                                                                                 the rows can be carried about. Drawn
                                                                                 rather than written, since a glyph
                                                                                 for it is not in every font. -->
                                                                            <span class="grab" title="Drag to move this row"
                                                                                  @pointerdown="grabRow(p, row, $event)">
                                                                                <svg viewBox="0 0 6 10" aria-hidden="true">
                                                                                    <circle cx="2" cy="2" r="1"/>
                                                                                    <circle cx="2" cy="5" r="1"/>
                                                                                    <circle cx="2" cy="8" r="1"/>
                                                                                    <circle cx="5" cy="2" r="1"/>
                                                                                    <circle cx="5" cy="5" r="1"/>
                                                                                    <circle cx="5" cy="8" r="1"/>
                                                                                </svg>
                                                                            </span>
                                                                            <button class="outline secondary" :disabled="!online"
                                                                                    title="Drop this row"
                                                                                    @click="dropRow(p, row)">&times;</button>
                                                                        </td>
                                                                    </tr>
                                                                </template>
                                                            </tbody>
                                                        </table>

                                                        <!-- An empty table is a table
                                                             with no rows, which is a
                                                             thin line of nothing: say
                                                             it in words. -->
                                                        <p class="ro" x-show="!p.rows.length"><small>empty</small></p>

                                                        <div class="list-foot" x-show="!p.read_only">
                                                            <!-- Out while a row is still
                                                                 empty: that row is not
                                                                 part of the value, and
                                                                 handing out another one
                                                                 would only grow a table
                                                                 of nothing. -->
                                                            <button class="outline secondary" x-show="growable(p)"
                                                                    :disabled="!online || hasBlank(p)"
                                                                    :title="hasBlank(p)
                                                                            ? 'there is an empty row to fill in first'
                                                                            : 'Add a row'"
                                                                    @click="addRow(p)">Add a row</button>
                                                            <!-- Lit only once there is
                                                                 something to send, so
                                                                 that the table says
                                                                 whether it agrees with
                                                                 the simulator. -->
                                                            <button :disabled="!online || !p.dirty"
                                                                    @click="save(p)">Apply</button>
                                                        </div>
                                                    </div>
                                                </template>

                                                <!-- What the value is counted in, kept
                                                     beside the value rather than in it:
                                                     what is typed and what is sent must
                                                     stay the bare number. A metric's
                                                     figures carry their own. -->
                                                <small class="units" x-show="p.units && base(p).type !== 'metric'"
                                                       x-text="p.units"></small>
                                                <!-- Beside the value it was refused
                                                     for, which is the only place it
                                                     means anything. -->
                                                <small class="error" x-show="p.error" x-text="p.error"></small>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </article>
                    </div>

                    <!-- All the way over, this is the only part of the shut
                         side left on screen, so it is also the way back. -->
                    <div class="splitter cols" :class="{ shut: splitShut }"
                         @pointerdown="grabDivider($event, 'split')"
                         :title="splitShut
                                 ? 'Click to bring that side back, or drag it over'
                                 : 'Drag to share the room out; drag it all the way over to shut one side'">
                        <span class="grip" x-show="splitShut" x-cloak
                              x-text="split === 1 ? '\u2039' : '\u203a'"></span>
                    </div>

                    <!-- The map. Everything one can click is HTML, absolutely
                         positioned, so that it is styled and handled like the rest
                         of the page; only the cables are SVG, and they go in as one
                         lump because a <template> inside an <svg> is parsed as an
                         SVG element with no content, which x-for cannot use. -->
                    <div class="pane map" x-show="split < 1" x-cloak
                         :class="{ picking: !!picking }"
                         x-ref="mapPane" x-init="watchMap()"
                         @wheel="zoomMap($event)" @pointerdown="panMap($event)"
                         @resize.window="measureMap()">

                        <!-- Under everything, and never in the way: enough of
                             the world to tell the reader which sea they are
                             looking at. -->
                        <svg class="coast"><path :d="coastPath()"></path></svg>

                        <svg class="cables" x-html="edgeSvg()"></svg>

                        <!-- A cable is a widget with properties of its own, so its
                             name on the line is the way to it. -->
                        <template x-for="e in mapScene().edges" :key="e.key">
                            <a href="#" class="cable-label" :class="{ on: e.on }"
                               x-show="e.name && e.room"
                               :style="`left:${e.mx}px; top:${e.my}px`"
                               @pointerdown.stop
                               @click.prevent.stop="select(selected.sim, e.via)"
                               x-text="e.name"></a>
                        </template>

                        <!-- Where a cable really lands, when what it lands on is
                             inside a box that is shut. -->
                        <template x-for="p in mapScene().ports" :key="p.key">
                            <a href="#" class="port"
                               :style="`left:${p.x}px; top:${p.y}px`"
                               @pointerdown.stop
                               @click.prevent.stop="select(selected.sim, p.id)"
                               x-text="p.name"></a>
                        </template>

                        <template x-for="b in mapScene().boxes" :key="b.id">
                            <div class="box"
                                 :class="{ selected: isSelected(selected.sim, b.id),
                                           holds: b.holds,
                                           open: b.open, unplaced: b.nowhere,
                                           picked: pickedEnds().includes(b.id),
                                           unpluggable: picking &&
                                                        !canTakeCable(get(selected.sim, b.id)) }"
                                 :style="`left:${b.x}px; top:${b.y}px;
                                          width:${b.w}px; height:${b.h}px`"
                                 @pointerdown.stop="dragBox(b.id, $event)">
                                <button class="twisty" x-show="b.hasKids"
                                        :title="isOpen(b.id) ? 'Hide what is inside'
                                                             : 'Show what is inside'"
                                        @pointerdown.stop
                                        @click.stop="toggleBox(b.id)"
                                        x-text="isOpen(b.id) ? '−' : '+'"></button>
                                <span class="name" x-text="b.name"></span>
                                <!-- What a shut box is folding away: cables with
                                     both ends inside it, which would otherwise
                                     simply not be there. -->
                                <span class="folded" x-show="b.inside"
                                      :title="b.inside + (b.inside === 1 ? ' cable is' : ' cables are') +
                                              ' inside this box'"
                                      x-text="b.inside"></span>
                                <!-- Which end of the cable being drawn this is:
                                     the order the two are clicked in is what the
                                     form reads as "from" and "to". It stays for
                                     as long as that form is open: the form names
                                     the two ends, the map is what says where
                                     they are. -->
                                <span class="end" x-show="pickedEnds().includes(b.id)"
                                      :title="`end ${pickedEnds().indexOf(b.id) + 1} of the new ${buildingType()}`"
                                      x-text="pickedEnds().indexOf(b.id) + 1"></span>
                            </div>
                        </template>

                        <!-- Everything with no place of its own. It is not at 0,0
                             -- it is nowhere, and this is where nowhere is drawn;
                             dragging a box back down here takes it off the map. -->
                        <!-- Nowhere, and therefore also where a new device
                             appears: nothing is built with a place, and this is
                             the one part of the map that says so. -->
                        <div class="tray-line" :style="`top:${mapScene().trayTop}px`">
                            <div class="adder" @pointerdown.stop @wheel.stop>
                                <template x-if="picking">
                                    <span class="picking">
                                        <small x-text="`click ${endsOf(picking.type).length - picking.ends.length} more device(s) to join with a ${picking.type.type}`"></small>
                                        <button class="outline secondary stop"
                                                @click="cancelAdd()">stop</button>
                                    </span>
                                </template>
                                <button class="outline secondary add" x-show="!picking"
                                        :disabled="!online || !!adding"
                                        title="Build a new device. It arrives here, with no place of its own; drag it onto the map to give it one"
                                        @click="toggleTypeMenu()">+ add</button>
                                <div class="type-menu" x-show="typeMenu" x-cloak
                                     @click.outside="typeMenu = false">
                                    <template x-for="t in deviceTypes" :key="t.type">
                                        <button class="outline secondary" :title="t.descr"
                                                @click="startAdd(t)" x-text="t.type"></button>
                                    </template>
                                </div>
                            </div>
                            <small x-text="mapScene().trayCount
                                           ? 'not placed'
                                           : 'drop a box here to take it off the map'"></small>
                        </div>

                        <div class="map-tools">
                            <button class="outline secondary" @pointerdown.stop
                                    @click.stop="fitMap()"
                                    title="Frame everything that has been placed">fit</button>
                        </div>
                        <small class="error map-error" x-show="mapError" x-text="mapError"></small>
                    </div>
                </div>

            </div>
        </template>

        <!-- How much of the window the dock is worth against the network
             above it is a question about the screen and about what is being
             watched, so it is asked of the reader rather than answered here.
             Same divider as between the two columns, along the other axis. -->
        <div class="splitter rows" x-show="charts.length || logged.length"
             x-cloak :class="{ shut: dockShut }"
             @pointerdown="grabDivider($event, 'dock')"
             :title="dockShut
                     ? 'Click to bring that side back, or drag it over'
                     : 'Drag to share the room out; drag it all the way over to shut one side'">
            <span class="grip" x-show="dockShut" x-cloak
                  x-text="dockShare === 0 ? '\u25b4' : '\u25be'"></span>
        </div>

        <!-- ================= the dock ================= -->
        <!-- Outside the block above: what is watched here outlives the
             selection, a chart as much as a log. Each panel keeps a header
             that stays put when it is folded away, so that what is being
             watched is legible even when it is not shown. -->
        <section class="dock" x-cloak
                 x-show="(charts.length || logged.length) && dockShare > 0"
                 :style="allFolded() ? 'flex-basis: auto'
                                     : `flex-basis: ${dockShare * 100}%`">

        <section class="panel" x-show="charts.length"
                 :class="{ folded: collapsed.charts }">
            <header>
                <button class="twisty" @click="fold('charts')"
                        :title="collapsed.charts ? 'Show them' : 'Fold them away'"
                        x-text="collapsed.charts ? '▸' : '▾'"></button>
                <strong>Charts</strong>
                <small x-text="charts.length + (charts.length > 1 ? ' charts' : ' chart')"></small>
            </header>
        <div class="body charts" x-show="!collapsed.charts">
            <template x-for="c in charts" :key="c.id">
                <article class="chart"
                         :class="{ over: dragOver === c.id || chartHint === c.id }"
                         @dragover.prevent="dragOver = canDrop(c) ? c.id : null"
                         @dragleave="dragOver = null"
                         @drop.prevent="dropOn(c)">
                    <header>
                        <!-- A chart is named only while a menu is open on some
                             metric: the name is there to be matched against
                             that menu, and says nothing the rest of the
                             time. -->
                        <strong class="chart-name" x-show="chartMenu" x-cloak
                                x-text="chartName(c)"></strong>
                        <span class="chart-legend">
                            <template x-for="l in lines(c)" :key="l.key">
                                <span class="entry">
                                    <i :style="'background:' + l.color"></i>
                                    <span class="what" x-text="l.label"></span>
                                    <b x-text="l.text"></b>
                                    <small x-text="l.units"></small>
                                    <button title="Take this line off the chart"
                                            @click="removeLine(c, l.key)">&times;</button>
                                </span>
                            </template>
                            <span class="entry empty" x-show="!lines(c).length">
                                <small>Nothing has been written down yet.</small>
                            </span>
                        </span>
                        <button class="close" title="Close this chart"
                                @click="closeChart(c)">&times;</button>
                    </header>
                    <div class="plot" x-init="mountChart(c, $el)"></div>
                </article>
            </template>
        </div>
        </section>

        <section class="panel logs" x-show="logged.length"
                 :class="{ folded: collapsed.logs }">
            <header>
                <button class="twisty" @click="fold('logs')"
                        :title="collapsed.logs ? 'Show them' : 'Fold them away'"
                        x-text="collapsed.logs ? '▸' : '▾'"></button>
                <strong>Logs</strong>
                <!-- One entry per widget: what it is, how deep to follow it,
                     and a cross to stop. -->
                <span class="log-legend">
                    <template x-for="w in logged" :key="w.sim + '/' + w.widget">
                        <span class="entry">
                            <i :style="'background:' + w.color"></i>
                            <span class="what" x-text="w.name"></span>
                            <select x-model="w.level" :disabled="!online"
                                    title="How deep to follow this one"
                                    @change="relevel(w)">
                                <template x-for="l in levels" :key="l">
                                    <option :value="l" x-text="l"></option>
                                </template>
                            </select>
                            <button title="Stop following this one"
                                    @click="unwatch(w)">&times;</button>
                        </span>
                    </template>
                </span>
                <!-- Only there when the reader has scrolled away from the
                     newest line, which is the only time it has anything to
                     do. -->
                <button class="outline secondary follow-tail" x-show="!logFollow"
                        title="Jump to the newest line and follow it"
                        @click="jumpToBottom()">&darr; newest</button>
            </header>
            <div class="body log" x-show="!collapsed.logs"
                 x-ref="logBody" x-init="mountLog($el)" @scroll="onLogScroll()">
                <template x-for="m in logLines()" :key="m.key">
                    <div class="line" :class="m.level">
                        <span class="t" x-text="clock(m.t)"></span>
                        <span class="who" :style="'color:' + m.color"
                              x-text="m.who"></span>
                        <span class="msg" x-text="m.text"></span>
                    </div>
                </template>
                <p class="quiet" x-show="!logLines().length">
                    <small>Nothing logged yet.</small></p>
            </div>
        </section>

        </section>
    </main>
</div>

</body>
</html>
